name: iOS Native Validation

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  ios-build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npx expo prebuild --platform ios --non-interactive --no-install
      - run: pod install --project-directory=ios
      - run: xcodebuild -workspace ios/PadhaiKaro.xcworkspace -scheme PadhaiKaro -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' build
